<!doctype html>

<head>

<body>
<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="haze"></div>
  <svg class="dunes" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--dune-a)"/><stop offset="100%" stop-color="var(--dune-b)"/></linearGradient>
      <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--dune-c)"/><stop offset="100%" stop-color="var(--dune-d)"/></linearGradient>
      <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--dune-e)"/><stop offset="100%" stop-color="var(--dune-f)"/></linearGradient>
      <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--ember-hi)" stop-opacity="0"/>
        <stop offset="28%" stop-color="var(--ember-hi)" stop-opacity=".75"/>
        <stop offset="62%" stop-color="var(--ember)" stop-opacity=".45"/>
        <stop offset="100%" stop-color="var(--ember-hi)" stop-opacity="0"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-60%" width="140%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
      <radialGradient id="disc" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--ember-hi)"/>
        <stop offset="70%" stop-color="var(--ember)"/>
        <stop offset="100%" stop-color="var(--ember-lo)"/>
      </radialGradient>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="55%" stop-color="var(--ember)" stop-opacity=".22"/>
        <stop offset="100%" stop-color="var(--ember)" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="halo" cx="740" cy="600" r="260" fill="url(#halo)"/>
    <circle class="disc" cx="740" cy="600" r="120" fill="url(#disc)"/>
    <path fill="url(#d1)" d="M0 612c210-62 352 16 556-22 214-40 330-138 520-116 138 16 250 78 364 96v330H0Z"/>
    <path class="crest" fill="none" stroke="url(#crest)" stroke-width="2.5" filter="url(#soft)" d="M0 612c210-62 352 16 556-22 214-40 330-138 520-116 138 16 250 78 364 96"/>
    <path fill="url(#d2)" d="M0 716c188-96 336-52 520-10 206 47 356-4 512-62 118-44 254-40 408 6v250H0Z"/>
    <path class="crest" fill="none" stroke="url(#crest)" stroke-width="2" filter="url(#soft)" opacity=".7" d="M0 716c188-96 336-52 520-10 206 47 356-4 512-62 118-44 254-40 408 6"/>
    <path fill="url(#d3)" d="M0 820c236-84 390-26 588 14 198 40 346 6 500-38 120-34 244-24 352 18v86H0Z"/>
    <path class="crest" fill="none" stroke="url(#crest)" stroke-width="1.6" filter="url(#soft)" opacity=".45" d="M0 820c236-84 390-26 588 14 198 40 346 6 500-38 120-34 244-24 352 18"/>
  </svg>
  <div class="grain"></div>
</div>

<div class="brandbar" id="brandbar">
  <img id="logo" class="brandmark" alt="" src="">
</div>

<main class="card" id="card" hidden>
  <header class="hero">
    <img id="photo" class="photo" alt="" hidden>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="bio" id="bio"></p>
  </header>

  <section class="actions" aria-label="Schnellaktionen">
    <button class="btn btn-primary" id="saveContact" type="button">
      <svg viewBox="0 0 24 24" class="i"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
      Kontakt speichern
    </button>
  </section>

  <section class="groups" id="groups" aria-label="Links"></section>

  <section class="share" aria-label="Teilen">
    <button class="btn btn-ghost" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" class="i"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      Teilen
    </button>
    <button class="btn btn-ghost" id="qrBtn" type="button">
      <svg viewBox="0 0 24 24" class="i"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>
      QR-Code
    </button>
  </section>

  <footer class="foot">
    <nav id="footLinks"></nav>
    <p class="sig" id="sig">Digitale Visitenkarte</p>
  </footer>
</main>

<dialog class="qr" id="qrModal" aria-label="QR-Code dieser Karte">
  <div class="qr-box"><div id="qrCanvas"></div></div>
  <p class="qr-url" id="qrUrl"></p>
  <button class="btn btn-ghost" id="qrClose" type="button">Schließen</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../assets/js/brand.js?v=20260923-0905"></script>
<script src="profil.js?v=20260923-0905"></script>

<script src="../../assets/js/app.js?v=20260923-0905"></script>
</body>
</html>
